<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LUX3D 资产检查</title>
    <style>
      html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #111416; }
      canvas { display: block; }
      #status { position: fixed; left: 18px; bottom: 16px; color: #dfd4bd; font: 12px/1.5 Consolas, monospace; }
    </style>
  </head>
  <body>
    <div id="status">正在加载 LUX3D GLB…</div>
    <script type="module">
      import * as THREE from 'three'
      import { OrbitControls } from 'three/addons/controls/OrbitControls.js'
      import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js'
      import { MeshoptDecoder } from 'three/addons/libs/meshopt_decoder.module.js'

      const params = new URLSearchParams(location.search)
      const src = params.get('src') || '/models/candles/melted-five-arm-candelabra-optimized.glb'
      const status = document.querySelector('#status')
      const scene = new THREE.Scene()
      scene.background = new THREE.Color('#111416')

      const camera = new THREE.PerspectiveCamera(36, innerWidth / innerHeight, 0.01, 100)
      const renderer = new THREE.WebGLRenderer({ antialias: true })
      renderer.setPixelRatio(Math.min(devicePixelRatio, 2))
      renderer.setSize(innerWidth, innerHeight)
      renderer.outputColorSpace = THREE.SRGBColorSpace
      renderer.toneMapping = THREE.ACESFilmicToneMapping
      renderer.toneMappingExposure = 1.25
      document.body.append(renderer.domElement)

      const controls = new OrbitControls(camera, renderer.domElement)
      controls.enableDamping = true
      scene.add(new THREE.HemisphereLight('#d8e6ee', '#26120d', 2.2))
      const key = new THREE.DirectionalLight('#ffd9b2', 4)
      key.position.set(3, 5, 4)
      scene.add(key)
      const rim = new THREE.DirectionalLight('#45a7a9', 2.5)
      rim.position.set(-4, 2, -3)
      scene.add(rim)

      new GLTFLoader().setMeshoptDecoder(MeshoptDecoder).load(
        src,
        (gltf) => {
          scene.add(gltf.scene)
          const bounds = new THREE.Box3().setFromObject(gltf.scene)
          const size = bounds.getSize(new THREE.Vector3())
          const center = bounds.getCenter(new THREE.Vector3())
          gltf.scene.position.sub(center)
          const radius = Math.max(size.x, size.y, size.z) * 0.75
          camera.position.set(radius * 1.25, radius * 0.75, radius * 1.55)
          camera.near = Math.max(radius / 100, 0.001)
          camera.far = radius * 20
          camera.updateProjectionMatrix()
          controls.target.set(0, 0, 0)
          controls.update()
          status.textContent = `${src} · ${size.x.toFixed(3)} × ${size.y.toFixed(3)} × ${size.z.toFixed(3)}`
        },
        undefined,
        (error) => {
          console.error(error)
          status.textContent = `加载失败：${src}`
        },
      )

      addEventListener('resize', () => {
        camera.aspect = innerWidth / innerHeight
        camera.updateProjectionMatrix()
        renderer.setSize(innerWidth, innerHeight)
      })

      renderer.setAnimationLoop(() => {
        controls.update()
        renderer.render(scene, camera)
      })
    </script>
  </body>
</html>
